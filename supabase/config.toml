# Minimal Supabase CLI config for local development (`supabase start`).
project_id = "basic-to-advanced"

[api]
port = 54321

[db]
port = 54322
major_version = 15

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth", "http://localhost:4173/auth"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = true

[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[functions.ai]
verify_jwt = true
